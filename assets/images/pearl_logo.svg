<svg width="340" height="95" viewBox="0 0 340 95" fill="none" xmlns="http://www.w3.org/2000/svg" class="pearl-official-logo">
  <!-- Outer Dark Circle Badge -->
  <g class="logo-circle-emblem">
    <!-- Outer Ring -->
    <circle cx="46" cy="46" r="38" fill="none" stroke="currentColor" stroke-width="7"/>
    <!-- Tree Trunk with Branches & Root Base -->
    <path d="M46 48 L46 68 M46 54 L38 63 M46 58 L54 64 M42 68 L46 68 L50 68" stroke="#10B981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Tree Leaves Cluster (Exact leaves shape) -->
    <ellipse cx="46" cy="22" rx="4.5" ry="6.5" fill="#10B981"/>
    <ellipse cx="38" cy="26" rx="4" ry="6" fill="#10B981"/>
    <ellipse cx="54" cy="26" rx="4" ry="6" fill="#10B981"/>
    <ellipse cx="32" cy="32" rx="4" ry="5.5" fill="#10B981"/>
    <ellipse cx="60" cy="32" rx="4" ry="5.5" fill="#10B981"/>
    <ellipse cx="46" cy="30" rx="5" ry="7" fill="#10B981"/>
    <ellipse cx="38" cy="38" rx="4.5" ry="6" fill="#10B981"/>
    <ellipse cx="54" cy="38" rx="4.5" ry="6" fill="#10B981"/>
    <ellipse cx="28" cy="40" rx="3.5" ry="5" fill="#10B981"/>
    <ellipse cx="64" cy="40" rx="3.5" ry="5" fill="#10B981"/>
    <ellipse cx="46" cy="42" rx="4.5" ry="6" fill="#10B981"/>
  </g>

  <!-- Wordmark PEARL -->
  <g class="logo-wordmark">
    <!-- P -->
    <path d="M104 20 H126 C136 20 144 26 144 36 C144 45 136 50 126 50 H116 V68 H104 V20 Z M116 29 V41 H125 C130 41 133 38 133 35 C133 32 130 29 125 29 H116 Z" fill="currentColor"/>
    
    <!-- E - 3 Green Horizontal Bars -->
    <rect x="152" y="20" width="38" height="7.5" rx="2" fill="#10B981"/>
    <rect x="152" y="41" width="38" height="7.5" rx="2" fill="#10B981"/>
    <rect x="152" y="61" width="38" height="7.5" rx="2" fill="#10B981"/>

    <!-- A in Serif style -->
    <path d="M210 20 L228 68 H215 L211 58 H198 L194 68 H183 L202 20 H210 Z M205 34 L201 48 H208 L205 34 Z" fill="currentColor"/>

    <!-- R in Serif style -->
    <path d="M235 20 H256 C266 20 273 26 273 35 C273 42 268 47 260 49 L274 68 H260 L248 51 H247 V68 H235 V20 Z M247 29 V41 H254 C259 41 262 38 262 35 C262 32 259 29 254 29 H247 Z" fill="currentColor"/>

    <!-- L in Serif style -->
    <path d="M284 20 H296 V58 H318 V68 H284 V20 Z" fill="currentColor"/>

    <!-- TM Superscript -->
    <text x="321" y="22" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" fill="currentColor">TM</text>
  </g>

  <!-- Tagline: PLYWOOD -->
  <text x="248" y="86" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" letter-spacing="3" fill="currentColor" text-anchor="middle">PLYWOOD</text>
</svg>
